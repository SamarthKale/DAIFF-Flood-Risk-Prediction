[project]
name = "daiff"
version = "0.1.0"
description = "AI-Based Deforestation Monitoring and Flood Risk Prediction (DAIFF)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "rasterio>=1.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "earthengine-api>=1.0",   # installed early so teammates can run the GEE smoke test (docs/setup/gee.md)
  "numba>=0.60",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "pyarrow>=16",
  "dask[distributed]>=2024.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "rio-tiler>=7.0",
  "netCDF4>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27", "pillow>=10.0"]
hpc = ["dask-jobqueue>=0.9"]
unet = ["torch>=2.3"]  # CPU build locally (tiny tests); training runs on Colab only

[project.scripts]
daiff = "daiff.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daiff"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_colab_notebooks.py" = ["E501"]  # long lines inside embedded notebook source

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gee: needs live Google Earth Engine access (skipped in CI)",
  "slow: long-running test",
  "colab: needs a Colab GPU runtime",
]